<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APK2IPK TV test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="eyebrow">APK2IPK / LG webOS</p>
    <h1>A web app, ready for the big screen.</h1>
    <p>This sample tests packaging, local storage and remote input. It is not an Android app emulator.</p>
    <section>
      <button id="count">Test local storage</button>
      <button id="reset">Reset</button>
      <button id="back">Back / exit</button>
    </section>
    <output id="result" aria-live="polite">Use Left / Right, then OK.</output>
    <p id="keys">Last key: none</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
