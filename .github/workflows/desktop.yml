name: Build desktop executables
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apk2ipk/**'
      - 'launch.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name APK2IPK-Studio launch.py
      - name: Test Windows executable without Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exeProcess = Start-Process -FilePath .\dist\APK2IPK-Studio.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($exeProcess.ExitCode -ne 0) { throw "Bundled GUI smoke test failed: $($exeProcess.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: APK2IPK-Studio-${{ runner.os }}
          path: dist/
      - name: Publish direct Windows download
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_version=$(python -c "from apk2ipk import __version__; print(__version__)")
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          versioned_exe="dist/APK2IPK-Studio-${app_version}.exe"
          cp dist/APK2IPK-Studio.exe "$versioned_exe"
          sha256sum "$versioned_exe" > "${versioned_exe}.sha256"
          if ! gh release view desktop-latest > /dev/null 2>&1; then
            gh release create desktop-latest --target "$GITHUB_SHA" --title "APK2IPK Studio — Windows download" --notes-file docs/DOWNLOAD.md
          fi
          gh release edit desktop-latest --title "APK2IPK Studio — Windows download" --notes-file docs/DOWNLOAD.md
          gh release upload desktop-latest dist/APK2IPK-Studio.exe --clobber
          gh release upload desktop-latest "$versioned_exe" "${versioned_exe}.sha256" --clobber
